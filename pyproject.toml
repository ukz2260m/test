[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edit-cli"
version = "0.1.0"
description = "Fortnite gameplay recording -> Premiere-ready timeline (FCP7 XML) + ASS subtitles, fully automated CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "click>=8.1",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "easyocr>=1.7",
    "faster-whisper>=1.0",
    "soundfile>=0.12",
    "librosa>=0.10",
    "tqdm>=4.66",
    "rapidfuzz>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
build = [
    "pyinstaller>=6.6",
]

[project.scripts]
edit-cli = "edit_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
